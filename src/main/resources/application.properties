spring.application.name=upc-pre-202501-cc-1asi0732-4441-TeemoSolutions-Back-End
server.port=${PORT:8080}
spring.main.lazy-initialization=true

# JWT Configuration Properties
authorization.jwt.secret= WriteHereYOurSecretStringsForTokenSigningCredentials
authorization.jwt.expiration.days=7

# Configuration of Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.show-actuator=true

# MongoDB Configuration Properties
# MongoDB Configuration Properties para conexi�n local
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/TeemoDB}
spring.data.mongodb.database=TeemoDB
spring.data.mongodb.auto-index-creation=true
app.seed.roles.enabled=false
app.seed.mapping.enabled=false
app.seed.mapping.reset=false
app.route-graph.warmup.enabled=false
routing.maritime.catalog-backbone.enabled=false
# Offline, research-only v2 snapshot. All three must identify the same validated artifact.
routing.maritime.v2.artifact=${MARITIME_GRAPH_ARTIFACT:}
routing.maritime.v2.sha256=${MARITIME_GRAPH_SHA256:}
routing.maritime.v2.validation-report=${MARITIME_GRAPH_VALIDATION_REPORT:}
routing.maritime.v2.max-entry-bytes=${MARITIME_GRAPH_MAX_ENTRY_BYTES:536870912}

# Global Fishing Watch / AIS overlay
routing.maritime.gfw.enabled=false
routing.maritime.gfw.api-token=${GFW_API_TOKEN:}
routing.maritime.gfw.timeout=60s
routing.maritime.gfw.spatial-resolution=HIGH
routing.maritime.gfw.response-buffer-mb=128
routing.maritime.gfw.max-cells-per-region=500
routing.maritime.gfw.nearest-neighbors=4
routing.maritime.gfw.bridge-connections=3
routing.maritime.gfw.min-hours=24.0
routing.maritime.gfw.min-vessel-ids=1
routing.maritime.gfw.max-neighbor-distance-nm=1200.0
routing.maritime.gfw.max-bridge-distance-nm=900.0
routing.maritime.gfw.vessel-types=cargo,tanker
routing.maritime.gfw.include-port-approach-regions=true
routing.maritime.gfw.port-approach-region-radius-degrees=3.0
routing.maritime.gfw.port-approach-region-grid-degrees=8.0
routing.maritime.gfw.max-port-approach-regions=96

ai.model.name=weather-delay
ai.model.version=0.1.0
ai.model.onnx=classpath:model/weather-delay.onnx

# src/main/resources/application.properties
ai.weather.om.waypoints=6

# OpenAPI/Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# application.properties
logging.level.org.teemo.solutions.upcpre202501cc1asi07324441teemosolutionsbackend.mapping.application.internal.inboundservices.RouteGraphBuilder=DEBUG

# NOAA hazard detection
ai.weather.hazard.noaa.enabled=true
ai.weather.hazard.noaa.base-url=https://api.weather.gov
ai.weather.hazard.noaa.timeout=6s
ai.weather.hazard.noaa.lat-padding-deg=5.0
ai.weather.hazard.noaa.lon-padding-deg=5.0
ai.weather.hazard.noaa.default-radius-km=600.0
ai.weather.hazard.noaa.max-results=25
ai.weather.hazard.noaa.user-agent=TeemoHazardService/1.0 (+support@teemo.solutions)

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=org.teemo.solutions@gmail.com
spring.mail.password=rppcznnnnbetswwk
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=org.teemo.solutions@gmail.com

openai.api.key=${OPENAI_API_KEY:}
